<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&amp;family=Outfit:wght@800;900&amp;display=swap');
      .logo-title {
        font-family: 'Outfit', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .logo-tagline {
        font-family: 'Caveat', 'Segoe Print', cursive, sans-serif;
        font-size: 32px;
        font-weight: 700;
        fill: #0030B0;
      }
    </style>
  </defs>

  <!-- 7 Interlocking Stars Rosette -->
